[package]
name = "candle-mi"
version = "0.1.24"
edition = "2024"
authors = ["Eric Jacopin"]
description = "Mechanistic interpretability for language models in Rust, built on candle"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mi-for-the-rust-of-us/candle-mi"
homepage = "https://github.com/mi-for-the-rust-of-us/candle-mi"
documentation = "https://docs.rs/candle-mi"
keywords = ["interpretability", "transformers", "mechanistic", "candle", "rust"]
categories = ["science"]
# MSRV 1.91, forced by `hf-fetch-model` 0.11.3 (a required dependency), which
# adopted `hf-hub` 1.0 and with it a mandatory `hf-xet`. Note that cargo's own
# MSRV resolution UNDER-REPORTS this floor: it reads declared `rust-version`
# fields, which bottom out at 1.89 (`konst`, `redb` via `xet-runtime`), but
# `xet-core-structures` declares none at all and calls
# `str::floor_char_boundary`, stable only since 1.91. The declared-metadata
# floor is a lower bound; only a real build proves the number.
rust-version = "1.91"
# Keep the published package lean (the library is just `src/`). Excludes repo
# content crate consumers never need: docs + experiment data, validation
# scripts/oracle reference JSONs, screenshots/gifs, design notes, test fixtures,
# and example output data. All `[[example]]`/`[[test]]` `.rs` sources are kept;
# nothing here is referenced at compile time (verified: no `include_*!`).
exclude = [
    "docs/",
    "data/",
    "design/",
    "scripts/",
    "examples/results/",
    "examples/screenshots/",
    "examples/figure13/",
    "tests/fixtures/",
]

[dependencies]
# Candle ML framework (pinned to 0.11.x per design/candle-version.md)
candle-core = "0.11"
candle-nn = "0.11"

# HuggingFace integration.
# Pinned to `0.22` to match candle-core 0.11's own `tokenizers` dependency — a
# single resolved `tokenizers` version (no dev-tree duplicate). `default-features
# = false` drops the `progressbar` feature (tokenizers' training progress bars,
# which candle-mi never uses — its download bars are hf-fetch-model's indicatif
# 0.18); `onig` (Oniguruma regex — tokenization parity) and `esaxx_fast` are the
# other two default features, kept unchanged. The dev tree stays on a single
# active `windows-sys` (0.61.2) — see the v0.1.18 windows-sys dedup.
tokenizers = { version = "0.22", default-features = false, features = ["onig", "esaxx_fast"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
safetensors = "0.4"

# Error handling (typed MIError per design/error-handling.md)
thiserror = "2"
anyhow = "1.0"

# Random number generation
rand = "0.8"

# Frozen generator for seeded weight creation (`src/util/rng.rs`). `rand`'s
# `StdRng` documents itself as NOT reproducible across releases and points at
# this crate as the remedy, so weight generation names `ChaCha8Rng` directly.
# Already in the tree: `rand_chacha` 0.3 *is* `StdRng`'s implementation under
# `rand` 0.8, so this adds no compile unit. The pin is the point -- `ChaCha8`
# is a frozen specification, which is exactly the property being bought.
rand_chacha = "0.3"

# Statistics
statrs = "0.17"

# Logging
tracing = "0.1"

# Model downloads (hf-fetch-model wraps hf-hub 1.0 as of 0.11.3).
# The floor is 0.12.1 deliberately, not `^0.11.2`. 0.11.3 is the release that
# raised the MSRV to 1.91; allowing 0.11.2 would let a pre-1.91 toolchain
# back-solve to it and build candle-mi against a DIFFERENT dependency tree
# from the one stable resolves — an MSRV lane that silently stops testing what
# the stable lane tests. 0.11.4 moved the floor further to pick up the
# anamnesis 0.7.5 lockstep bump below; 0.11.5 (hf-fm `peek`) moved it again
# purely for freshness. 0.12.0 (backlog cleaning) moves it once more to pick
# up the anamnesis 0.7.7 lockstep bump below — no MSRV change of its own.
# 0.12.1 (quant-aware fit planning: `inspect --group-by`, `hf-fm quants`
# `--fits`, `inspect --cache-headers`) moves it once more for freshness — no
# MSRV change, no anamnesis lockstep bump (still ^0.7.7).
hf-fetch-model = { version = "0.12.1", features = ["indicatif"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

# Optional: process RAM + GPU VRAM measurement, delegated to the standalone
# `hypomnesis` crate (DXGI/NVML/nvidia-smi/Metal). Lean feature set — candle-mi
# only measures its own process and device totals, so `pdh` (foreign-process
# listing) is omitted; `metal` keeps macOS support.
# Floor moved 0.2.6 -> 0.2.9 so `GpuDeviceInfo::driver_version` is reachable:
# `scripts/resurrect.ps1` already requires the 0.2.9 `hmn` CLI to stamp the GPU
# and driver into `RESURRECTION.md`, and this keeps the library floor honest
# about the same release rather than leaving the two three versions apart.
# `default-features = false` means 0.2.8's `cli`-becomes-default change is inert
# here. No lockstep constraint applies: unlike anamnesis below, no hypomnesis
# type crosses between candle-mi's and hf-fetch-model's public APIs.
hypomnesis = { version = "0.2.9", optional = true, default-features = false, features = [
    "nvml",
    "dxgi",
    "nvidia-smi-fallback",
    "metal",
] }

# Optional: tensor format parsing via anamnesis
# - sae feature activates "npz" (Gemma Scope SAE weights)
# - stoicheia feature activates "pth" (AlgZoo .pth agnostic loading)
# - quantized feature activates "bnb"/"awq"/"gptq" (dequant-to-BF16 weight loading)
# Kept in lockstep with hf-fetch-model's own anamnesis requirement (^0.7.7
# as of hf-fetch-model 0.12.0) so cargo resolves a single anamnesis copy
# across the tree rather than two semver-incompatible ones (same hazard as
# the v0.1.18 windows-sys dedup). Bump this alongside any future
# hf-fetch-model release that moves its own anamnesis floor.
anamnesis = { version = "0.7.7", optional = true }

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
serial_test = "3.4.0"
tempfile = "3.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = "0.3"

