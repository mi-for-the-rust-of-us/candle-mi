[features]
default = ["cuda", "transformer"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
metal = ["candle-core/metal", "candle-nn/metal"]
transformer = []
mmap = []
rwkv = []
rwkv-tokenizer = []
# Diffusion-LM backend (MDLM masked-diffusion DiT). Standalone — does not
# require `transformer`. See `src/diffusion/`.
diffusion = []
clt = []
sae = ["dep:anamnesis", "anamnesis/npz"]
stoicheia = ["dep:anamnesis", "anamnesis/pth"]
# Load quantized checkpoints (bitsandbytes NF4/FP4/INT8, AWQ, GPTQ) by
# dequantizing to BF16 in memory via anamnesis, then loading the standard
# safetensors bytes through candle's VarBuilder. See `backend::from_pretrained`.
quantized = ["dep:anamnesis", "anamnesis/bnb", "anamnesis/awq", "anamnesis/gptq"]
memory = ["dep:hypomnesis"]
memory-debug = ["memory", "hypomnesis/debug-output"]
# Checkpointable `AdamW` (`src/optim.rs`), for training runs staged across
# process boundaries. Default-OFF on purpose: candle-mi is an interpretability
# crate first, and an inference-only consumer should not compile an optimizer.
# candle-mi still ships no training loop, schedule or data loader — those are
# experiment-shaped and stay with the caller.
training = []

[lints.rust]
# unsafe_code is controlled via cfg_attr in lib.rs (forbid by default, deny with mmap/memory)
elided_lifetimes_in_paths = "deny"     # Rule 1
missing_docs              = "warn"     # Rule 12 prerequisite

[lints.clippy]
# Rule 3: No panics or indexing in library code
unwrap_used               = "deny"
expect_used               = "deny"
panic                     = "deny"
indexing_slicing           = "deny"

# Rule 7: Exhaustive matching
wildcard_enum_match_arm             = "deny"
match_wildcard_for_single_variants  = "deny"

# Rule 11: #[non_exhaustive] policy (forces a decision on every public enum)
exhaustive_enums          = "warn"

# Rule 2: Explicit conversions (warn only — numeric casts need annotation, not prohibition)
as_conversions            = "warn"
cast_possible_truncation  = "warn"
cast_precision_loss       = "warn"
cast_sign_loss            = "warn"

# Rule 9: Prefer iterators (warn only — recurrent algorithms need explicit exemption)
explicit_iter_loop        = "warn"
manual_filter_map         = "warn"
manual_find_map           = "warn"
needless_range_loop       = "warn"

# Documentation
missing_docs_in_private_items = "warn"
missing_errors_doc        = "warn"
missing_panics_doc        = "warn"

# General pedantic + nursery quality baseline
pedantic  = { level = "warn", priority = -1 }
nursery   = { level = "warn", priority = -1 }

# Suppressed lints that are too noisy for this domain
module_name_repetitions   = "allow"
too_many_lines            = "allow"
must_use_candidate        = "warn"      # Rule 17

# docs.rs builds in a sandbox without CUDA toolkit — disable cuda, enable all
# CPU-safe features so the generated docs cover the full public API surface.
[package.metadata.docs.rs]
no-default-features = true
features = ["transformer", "rwkv", "rwkv-tokenizer", "diffusion", "clt", "sae", "quantized", "mmap", "memory", "stoicheia", "training"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1
