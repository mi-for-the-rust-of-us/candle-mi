name: Publish

on:
  push:
    # Publish to crates.io only on release tags of the form vMAJOR.MINOR.PATCH
    # (e.g. v0.1.9, v0.2.0, v1.10.25).
    #
    # Milestone and pre-release tags that carry a hyphenated suffix are
    # git-level checkpoints ONLY — they do NOT publish to crates.io:
    #   v0.1.9-plt          (Stage 1 complete, Gemma arm pending)
    #   v0.1.9-plt-gemma    (Gemma arm added)
    #   v1.0.0-rc.1         (release candidate, if ever adopted)
    #
    # NOTE: GitHub Actions does not allow `tags` and `tags-ignore` on the same
    # event. Use a single `tags:` list with `!`-prefixed exclusions instead.
    # See https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onpushbranchestagsbranches-ignoretags-ignore
    #
    # To publish a hyphenated tag intentionally, use the `workflow_dispatch`
    # trigger (manual run from the Actions tab).
    tags:
      - "v*"
      - "!v*-*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Full CI checks before publishing
      - name: Check formatting
        run: cargo fmt --check

      - name: Build (no default features — CPU only on CI)
        run: cargo build --no-default-features --features transformer

      - name: Clippy (pedantic)
        run: cargo clippy --all-targets --no-default-features --features transformer -- -W clippy::pedantic

      - name: Tests
        run: cargo test --no-default-features --features transformer

      - name: Build (RWKV)
        run: cargo build --no-default-features --features "rwkv,rwkv-tokenizer"

      - name: Clippy (RWKV, pedantic)
        run: cargo clippy --all-targets --no-default-features --features "rwkv,rwkv-tokenizer" -- -W clippy::pedantic

      - name: Tests (RWKV)
        run: cargo test --no-default-features --features "rwkv,rwkv-tokenizer"

      - name: Build (Stoicheia)
        run: cargo build --no-default-features --features stoicheia

      - name: Clippy (Stoicheia, pedantic)
        run: cargo clippy --all-targets --no-default-features --features stoicheia -- -W clippy::pedantic

      - name: Tests (Stoicheia)
        run: cargo test --no-default-features --features stoicheia --lib --test stoicheia_analysis --test validate_stoicheia

      # CLT pairs with `transformer`; without a dedicated lane, clt-only
      # regressions escape the transformer + rwkv lanes (mirrors ci.yml).
      - name: Build (CLT)
        run: cargo build --no-default-features --features "clt,transformer"

      - name: Clippy (CLT, pedantic)
        run: cargo clippy --all-targets --no-default-features --features "clt,transformer" -- -W clippy::pedantic

      - name: Tests (CLT)
        run: cargo test --no-default-features --features "clt,transformer" --lib

      # Quantized loading (bnb/AWQ/GPTQ dequant via anamnesis), opt-in, pairs with
      # `transformer`. Mirrors ci.yml so a quantized-path regression can't slip
      # through publish either. Parity tests are #[ignore]; this compiles them.
      - name: Build (Quantized)
        run: cargo build --no-default-features --features "quantized,transformer"

      - name: Clippy (Quantized, pedantic)
        run: cargo clippy --all-targets --no-default-features --features "quantized,transformer" -- -W clippy::pedantic

      - name: Tests (Quantized)
        run: cargo test --no-default-features --features "quantized,transformer" --lib --test validate_quantized_loading

      # SAE clippy (only appeared in a plain build before — no pedantic lint).
      - name: Build (SAE)
        run: cargo build --no-default-features --features "sae,transformer"

      - name: Clippy (SAE, pedantic)
        run: cargo clippy --all-targets --no-default-features --features "sae,transformer" -- -W clippy::pedantic

      # validate_plt_gemma needs clt+sae+transformer together; compile-check it
      # (the test is #[ignore]) so publish can't ship it broken.
      - name: Tests compile (clt + sae + transformer)
        run: cargo test --no-default-features --features "clt,sae,transformer" --test validate_plt_gemma --no-run

      # mmap gates the unsafe mmapped-safetensors loader; lint that path too.
      - name: Build (mmap)
        run: cargo build --no-default-features --features "mmap,transformer"

      - name: Clippy (mmap, pedantic)
        run: cargo clippy --all-targets --no-default-features --features "mmap,transformer" -- -W clippy::pedantic

      # Diffusion is a standalone backend (MDLM masked-diffusion DiT) that does
      # NOT imply `transformer`, so none of the lanes above compile it. Without
      # this lane the whole `src/diffusion/` module ships unverified by publish.
      - name: Build (Diffusion + examples)
        run: cargo build --no-default-features --features diffusion --examples

      - name: Clippy (Diffusion, pedantic)
        run: cargo clippy --all-targets --no-default-features --features diffusion -- -W clippy::pedantic

      - name: Tests (Diffusion)
        run: cargo test --no-default-features --features diffusion --lib --test validate_mdlm_forward --test validate_othello_forward

      # validate_bidirectional_sampler + validate_bidirectional_forward need
      # transformer + diffusion; both #[ignore], so compile-check them.
      - name: Tests compile (transformer + diffusion)
        run: cargo test --no-default-features --features "transformer,diffusion" --test validate_bidirectional_sampler --test validate_bidirectional_forward --no-run

      # Memory measurement (delegated to hypomnesis); standalone feature, no
      # other lane compiles it. Live CUDA checks are #[ignore]; CPU runs here.
      - name: Build (memory)
        run: cargo build --no-default-features --features memory

      - name: Clippy (memory, pedantic)
        run: cargo clippy --all-targets --no-default-features --features memory -- -W clippy::pedantic

      - name: Tests (memory)
        run: cargo test --no-default-features --features memory --lib --test validate_memory

      # memory-debug (memory + hypomnesis/debug-output): feature-resolution guard.
      - name: Build (memory-debug)
        run: cargo build --no-default-features --features memory-debug

      - name: Clippy (memory-debug, pedantic)
        run: cargo clippy --all-targets --no-default-features --features memory-debug -- -W clippy::pedantic

      # Checkpointable AdamW (`training`, default-off). Gates real source, so
      # this is a full build + clippy + test lane, not a resolution guard. The
      # parity tests are CPU-only and NOT #[ignore]d, so unlike the oracle suite
      # they actually execute here: they hold our transcribed update rule to
      # candle's own trajectory, which is the claim the module rests on.
      - name: Build (training)
        run: cargo build --no-default-features --features training

      - name: Clippy (training, pedantic)
        run: cargo clippy --all-targets --no-default-features --features training -- -W clippy::pedantic

      - name: Tests (training)
        run: cargo test --no-default-features --features training --lib --test validate_optim_parity

      # Doctests for every feature-gated public example in one pass (audit §1.10);
      # the old transformer+memory-only lane left clt/sae/rwkv doc examples
      # uncovered. Mirrors ci.yml so publish can't ship a broken doctest.
      - name: Doctests (all software features)
        run: cargo test --no-default-features --features "transformer,rwkv,rwkv-tokenizer,diffusion,clt,sae,stoicheia,quantized,memory,training" --doc

      # Rustdoc, per feature set. Mirrors ci.yml, and matters more here: what
      # docs.rs renders after a publish is the crate's public face, and a broken
      # intra-doc link cannot be fixed without cutting another release. A link to
      # a feature-gated item resolves when its feature is on and dangles when it
      # is off, so only a per-feature loop can see it. See CONVENTIONS.md,
      # Intra-Doc Link Safety.
      - name: Rustdoc (per feature)
        run: |
          set -e
          for f in "" "transformer" "rwkv,rwkv-tokenizer" "stoicheia" "clt,transformer" \
                   "quantized,transformer" "sae,transformer" "mmap,transformer" \
                   "diffusion" "memory" "memory-debug" "training" \
                   "transformer,rwkv,rwkv-tokenizer,diffusion,clt,sae,stoicheia,quantized,memory,training"; do
            echo "::group::cargo doc --features '$f'"
            cargo doc --no-default-features ${f:+--features "$f"} --no-deps
            echo "::endgroup::"
          done

      - name: Build (no default features)
        run: cargo build --no-default-features

      - name: Build (all software features)
        run: cargo build --no-default-features --features "transformer,rwkv,rwkv-tokenizer,diffusion,clt,sae,stoicheia,quantized,training"

      # Publish
      - name: Publish to crates.io
        run: cargo publish --no-default-features --features transformer
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
